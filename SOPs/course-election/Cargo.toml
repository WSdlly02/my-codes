[package]
name = "course-election"
version = "3.0.0"
edition = "2024"

[[bin]]
name = "course-election"
path = "src/bin/course-election.rs"

[[bin]]
name = "course-electiond"
path = "src/bin/course-electiond.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
glob = "0.3"
humantime = "2"
regex = "1.13"
reqwest = {
  version = "0.13",
  default-features = false,
  features = [
    "charset",
    "cookies",
    "form",
    "gzip",
    "http2",
    "json",
    "rustls",
  ]
}
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
strip = true  # 去除符号表，减小体积
lto = "fat"  # 跨 crate 链接时全局优化，性能提升 10-30%
panic = "abort"  # 减小体积并略微提升性能
codegen-units = 1  # 禁止并行编译，允许更激进的内联优化
